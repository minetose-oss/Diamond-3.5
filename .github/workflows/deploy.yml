name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -s -X POST "https://api.render.com/v1/services" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "diamond-3-5",
              "region": "singapore",
              "serviceType": "web",
              "ownerId": "${{ secrets.RENDER_OWNER_ID }}",
              "type": "static_site",
              "plan": "free"
            }' 2>&1 || true
          # Sync existing static site
          curl -s "https://api.render.com/v1/blueprints" \
            -H "Authorization: Bearer $RENDER_API_KEY" 2>&1 || true
